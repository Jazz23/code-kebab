apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: code-kebab-postgres
  namespace: code-kebab
spec:
  data:
  - remoteRef:
      conversionStrategy: Default
      decodingStrategy: None
      key: secret/code-kebab-postgres-uri
      metadataPolicy: None
      nullBytePolicy: Ignore
    secretKey: uri
  refreshInterval: 48h
  secretStoreRef:
    kind: ClusterSecretStore
    name: code-kebab-cluster-secret-store
  target:
    creationPolicy: Owner
    deletionPolicy: Retain
    name: code-kebab-postgres
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: code-kebab-route
  namespace: code-kebab
spec:
  parentRefs:
  - name: gateway
    namespace: gateway
    sectionName: https-code-kebab
  hostnames:
  - code-kebab.dev
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: code-kebab
      namespace: code-kebab
      port: 80
